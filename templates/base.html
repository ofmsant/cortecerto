{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{% endblock %} | CorteCerto</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link href="{% static 'css/cortecerto.css' %}" rel="stylesheet">
</head>
<body>
  <a class="visually-hidden-focusable" href="#conteudo-principal">Ir para o conteúdo</a>

  <header class="cc-cabecalho">
    <div class="container">
      <span class="cc-marca">CorteCerto</span>
    </div>
  </header>

  <main id="conteudo-principal" class="container py-4">
    {% if messages %}
      <div aria-live="polite">
        {% for mensagem in messages %}
          <div class="alert alert-{{ mensagem.tags|default:'info' }}" role="status">
            {{ mensagem }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
